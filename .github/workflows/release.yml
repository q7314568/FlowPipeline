name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FlowPipeline.slnx

      - name: Build
        run: dotnet build FlowPipeline.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/FlowPipeline.Tests/FlowPipeline.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/FlowPipeline/FlowPipeline.csproj -c Release --no-build -o artifacts/packages

      - name: Publish package
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Publish symbols
        run: dotnet nuget push "artifacts/packages/*.snupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
