name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FlowPipeline.slnx

      - name: Build
        run: dotnet build FlowPipeline.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/FlowPipeline.Tests/FlowPipeline.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/FlowPipeline/FlowPipeline.csproj -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
